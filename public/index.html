<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salafan Sex - Hisob-Kitob Daftari</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-input {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    .glass-input:focus {
      border-color: #3b82f6;
      outline: none;
    }
  </style>
</head>
<body class="p-3 pb-20">

  <div class="flex justify-between items-center mb-4">
    <h1 class="text-base font-bold text-slate-100">💎 Salafan Nazorati</h1>
    <span id="roleBadge" class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-blue-500/20 text-blue-400 border border-blue-500/30">
      Yuklanmoqda...
    </span>
  </div>

  <div class="grid grid-cols-2 gap-3 mb-4">
    <div class="glass-card p-4 rounded-2xl">
      <p class="text-xs text-slate-400 font-medium">Umumiy Qarzim</p>
      <h2 id="totalDebtSum" class="text-lg font-bold text-red-500 mt-1">0 UZS</h2>
    </div>
    <div class="glass-card p-4 rounded-2xl">
      <p class="text-xs text-slate-400 font-medium">Yuk Beruvchilar</p>
      <h2 id="suppliersCount" class="text-lg font-bold text-emerald-400 mt-1">0 ta</h2>
    </div>
  </div>

  <!-- Hamkorlar bo'limi -->
  <div class="glass-card p-4 rounded-2xl mb-4">
    <div class="flex justify-between items-center mb-3">
      <h3 class="text-xs font-bold text-blue-400 uppercase tracking-wider">👥 Hamkorlar Balansi</h3>
      <button id="addContactBtn" onclick="toggleContactForm()" class="hidden px-3 py-1 bg-blue-600 hover:bg-blue-500 text-xs font-bold rounded-lg transition">
        + Yangi Sex / Qarz
      </button>
    </div>

    <div id="contactFormBox" class="hidden mb-4 p-3 bg-slate-900/80 rounded-xl border border-slate-800">
      <input type="hidden" id="editingContactId">
      <div class="mb-2">
        <label class="text-[10px] text-slate-400 mb-1 block">Ism yoki Sex nomi:</label>
        <input type="text" id="contactName" placeholder="Masalan: Aziz Sex" class="glass-input w-full p-2 text-xs rounded-lg">
      </div>
      <div class="mb-2">
        <label class="text-[10px] text-slate-400 mb-1 block">Hamkor turi:</label>
        <select id="contactType" class="glass-input w-full p-2 text-xs rounded-lg">
          <option value="supplier">Yuk Beruvchi (Sex)</option>
          <option value="buyer">Yuk Oluvchi (Xaridor)</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="text-[10px] text-slate-400 mb-1 block">Boshlang'ich Eski Qarz (UZS):</label>
        <input type="number" id="initialDebt" placeholder="0" class="glass-input w-full p-2 text-xs rounded-lg font-bold text-red-400">
      </div>
      <div class="flex gap-2">
        <button onclick="saveContact()" id="contactSaveBtn" class="w-full py-2 bg-emerald-600 text-xs font-bold rounded-lg">Saqlash</button>
        <button onclick="cancelContactEdit()" id="contactCancelBtn" class="hidden w-1/3 py-2 bg-slate-700 text-xs font-bold rounded-lg">Bekor</button>
      </div>
    </div>

    <div id="contactsList" class="space-y-2"></div>
  </div>

  <!-- Operatsiya formasi -->
  <div id="adminFormCard" class="hidden glass-card p-4 rounded-2xl mb-4">
    <h2 id="formTitle" class="text-sm font-bold text-blue-400 mb-3">📦 Yangi Operatsiya Kiritish</h2>
    
    <form id="mainForm">
      <input type="hidden" id="recordId">

      <div class="grid grid-cols-2 gap-2 mb-3">
        <button type="button" id="btnTypePurchase" onclick="setOpType('purchase')" class="py-2 text-xs font-bold rounded-xl bg-blue-600 text-white">📦 Yuk Olish</button>
        <button type="button" id="btnTypePayment" onclick="setOpType('payment')" class="py-2 text-xs font-bold rounded-xl bg-slate-800 text-slate-400">💸 Naqd Pul Berish</button>
      </div>

      <div class="mb-3">
        <label class="text-xs text-slate-400 mb-1 block">Hamkorni tanlang:</label>
        <select id="selectedContactId" class="glass-input w-full p-2.5 text-xs rounded-xl"></select>
      </div>

      <div id="purchaseFields" class="space-y-3">
        <div>
          <label class="text-xs text-slate-400 mb-1 block">Rulon o'lchami:</label>
          <input type="text" id="rollSize" placeholder="Masalan: 40x60" class="glass-input w-full p-2.5 text-xs rounded-xl">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-slate-400 mb-1 block">Kilogramm (kg):</label>
            <input type="number" step="0.1" id="weightKg" oninput="calculateTotal()" placeholder="0.0" class="glass-input w-full p-2.5 text-xs rounded-xl">
          </div>
          <div>
            <label class="text-xs text-slate-400 mb-1 block">1 kg Narxi (UZS):</label>
            <input type="number" id="pricePerKg" oninput="calculateTotal()" placeholder="0" class="glass-input w-full p-2.5 text-xs rounded-xl">
          </div>
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1 block">Jami Yuk Summasi:</label>
          <input type="number" id="totalCalculatedPrice" placeholder="0" class="glass-input w-full p-2.5 text-xs rounded-xl font-bold text-amber-400">
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1 block">To'lov shakli:</label>
          <select id="paymentStatus" class="glass-input w-full p-2.5 text-xs rounded-xl">
            <option value="credit">Qarzga olindi</option>
            <option value="cash">Naqd berildi</option>
          </select>
        </div>
      </div>

      <div id="paymentFields" class="hidden space-y-3">
        <div>
          <label class="text-xs text-slate-400 mb-1 block">Berilgan Naqd Pul Summasi (UZS):</label>
          <input type="number" id="paidCashAmount" placeholder="0" class="glass-input w-full p-2.5 text-xs rounded-xl font-bold text-emerald-400">
        </div>
      </div>

      <div class="flex gap-2 mt-4">
        <button type="submit" id="saveBtn" class="w-full py-3 bg-blue-600 text-white font-bold text-xs rounded-xl">Saqlash</button>
        <button type="button" id="cancelBtn" onclick="resetMainForm()" class="hidden w-1/3 py-3 bg-slate-700 text-white font-bold text-xs rounded-xl">Bekor</button>
      </div>
    </form>
  </div>

  <!-- Jadval -->
  <div class="glass-card p-4 rounded-2xl">
    <div class="flex justify-between items-center mb-3">
      <h3 class="text-xs font-bold text-slate-200 uppercase">📋 Amaliyotlar Tarixi</h3>
      <button onclick="copyForExcel()" class="px-2.5 py-1 bg-emerald-600 text-[10px] font-bold rounded-lg">Excel</button>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left text-[11px]">
        <thead>
          <tr class="border-b border-slate-800 text-slate-400">
            <th class="py-2">Sana</th>
            <th class="py-2">Odam</th>
            <th class="py-2">O'lcham / Kg</th>
            <th class="py-2">Summa</th>
            <th id="thActions" class="py-2 text-right hidden">Amal</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="divide-y divide-slate-800/50"></tbody>
      </table>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const ADMIN_TELEGRAM_ID = "8081723573"; 
    const currentUserId = String(tg?.initDataUnsafe?.user?.id || "");
    const isAdmin = (currentUserId === ADMIN_TELEGRAM_ID || currentUserId === "");

    firebase.initializeApp({
      databaseURL: "https://hisob-kitob-daftar-default-rtdb.firebaseio.com/"
    });
    const db = firebase.database();

    let currentOpType = 'purchase';
    let contactsData = {};
    let historyData = {};

    function initInterface() {
      const badge = document.getElementById('roleBadge');
      if (isAdmin) {
        if(badge) {
          badge.innerText = "👑 Admin Rejimi";
          badge.className = "px-2.5 py-1 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30";
        }
        document.getElementById('adminFormCard')?.classList.remove('hidden');
        document.getElementById('addContactBtn')?.classList.remove('hidden');
        document.getElementById('thActions')?.classList.remove('hidden');
      } else {
        if(badge) badge.innerText = "👤 Yuk Beruvchi Paneli";
      }

      db.ref('contacts').on('value', (snapshot) => {
        contactsData = snapshot.val() || {};
        renderContacts();
        renderSelectOptions();
        calculateAllBalances();
      });

      db.ref('transactions').on('value', (snapshot) => {
        historyData = snapshot.val() || {};
        renderTable();
        calculateAllBalances();
      });
    }

    function setOpType(type) {
      currentOpType = type;
      const pF = document.getElementById('purchaseFields');
      const payF = document.getElementById('paymentFields');
      const bP = document.getElementById('btnTypePurchase');
      const bPay = document.getElementById('btnTypePayment');

      if (type === 'purchase') {
        pF?.classList.remove('hidden');
        payF?.classList.add('hidden');
        if(bP) bP.className = "py-2 text-xs font-bold rounded-xl bg-blue-600 text-white";
        if(bPay) bPay.className = "py-2 text-xs font-bold rounded-xl bg-slate-800 text-slate-400";
      } else {
        pF?.classList.add('hidden');
        payF?.classList.remove('hidden');
        if(bP) bP.className = "py-2 text-xs font-bold rounded-xl bg-slate-800 text-slate-400";
        if(bPay) bPay.className = "py-2 text-xs font-bold rounded-xl bg-emerald-600 text-white";
      }
    }

    function calculateTotal() {
      const kg = parseFloat(document.getElementById('weightKg')?.value) || 0;
      const price = parseFloat(document.getElementById('pricePerKg')?.value) || 0;
      const totalField = document.getElementById('totalCalculatedPrice');
      if (kg > 0 && price > 0 && totalField) {
        totalField.value = Math.round(kg * price);
      }
    }

    function calculateAllBalances() {
      let grandTotalDebt = 0;
      for (let cId in contactsData) { 
        contactsData[cId].balance = parseFloat(contactsData[cId].initialDebt || 0); 
      }

      for (let tId in historyData) {
        const item = historyData[tId];
        if (item && item.contactId && contactsData[item.contactId]) {
          if (item.opType === 'purchase' && item.paymentStatus === 'credit') {
            contactsData[item.contactId].balance += (item.totalAmount || 0);
          } else if (item.opType === 'payment') {
            contactsData[item.contactId].balance -= (item.totalAmount || 0);
          }
        }
      }

      for (let cId in contactsData) {
        grandTotalDebt += contactsData[cId].balance || 0;
      }
      const debtElem = document.getElementById('totalDebtSum');
      if(debtElem) debtElem.innerText = grandTotalDebt.toLocaleString() + " UZS";
      renderContacts();
    }

    function renderContacts() {
      const list = document.getElementById('contactsList');
      if (!list) return;
      list.innerHTML = '';
      let count = 0;

      for (let id in contactsData) {
        count++;
        const c = contactsData[id];
        const balance = c.balance || 0;
        const initDebt = parseFloat(c.initialDebt || 0);
        
        const div = document.createElement('div');
        div.className = "flex justify-between items-center p-2.5 bg-slate-900/60 rounded-xl border border-slate-800/80";
        div.innerHTML = `
          <div>
            <p class="font-bold text-xs text-slate-200">${c.name || 'Nomsiz'}</p>
            <p class="text-[10px] text-slate-400">
              ${c.type === 'supplier' ? 'Sex' : 'Xaridor'} 
              ${initDebt > 0 ? `<span class="text-amber-400 ml-1">(Eski qarz: ${initDebt.toLocaleString()})</span>` : ''}
            </p>
          </div>
          <div class="text-right">
            <p class="text-xs font-bold ${balance > 0 ? 'text-red-400' : 'text-emerald-400'}">${balance.toLocaleString()} UZS</p>
            ${isAdmin ? `
              <button onclick="editContact('${id}')" class="text-[10px] text-blue-400 underline ml-2">✏️ tahrirlash</button>
              <button onclick="deleteContact('${id}')" class="text-[10px] text-red-500 underline ml-2">🗑 o'chirish</button>
            ` : ''}
          </div>
        `;
        list.appendChild(div);
      }
      const supCount = document.getElementById('suppliersCount');
      if(supCount) supCount.innerText = count + " ta";
    }

    function renderSelectOptions() {
      const select = document.getElementById('selectedContactId');
      if (!select) return;
      const currentSelected = select.value;
      select.innerHTML = '<option value="">-- Hamkorsiz / Umumiy --</option>';
      for (let id in contactsData) {
        select.innerHTML += `<option value="${id}">${contactsData[id].name || 'Nomsiz'}</option>`;
      }
      if(currentSelected) select.value = currentSelected;
    }

    const mainForm = document.getElementById('mainForm');
    if (mainForm) {
      mainForm.addEventListener('submit', function(e) {
        e.preventDefault();
        if (!isAdmin) return alert("Sizda ruxsat yo'q!");

        const recordId = document.getElementById('recordId')?.value;
        const now = new Date();

        let recordData = {
          contactId: document.getElementById('selectedContactId')?.value || "",
          opType: currentOpType,
          date: recordId ? historyData[recordId].date : now.toLocaleString('uz-UZ'),
          timestamp: recordId ? historyData[recordId].timestamp : now.getTime()
        };

        if (currentOpType === 'purchase') {
          const kg = parseFloat(document.getElementById('weightKg')?.value) || 0;
          const price = parseFloat(document.getElementById('pricePerKg')?.value) || 0;
          let total = parseFloat(document.getElementById('totalCalculatedPrice')?.value) || 0;
          
          if (total === 0 && kg > 0 && price > 0) total = kg * price;

          recordData.rollSize = document.getElementById('rollSize')?.value || '-';
          recordData.weightKg = kg;
          recordData.pricePerKg = price;
          recordData.totalAmount = total;
          recordData.paymentStatus = document.getElementById('paymentStatus')?.value || 'credit';
        } else {
          recordData.totalAmount = parseFloat(document.getElementById('paidCashAmount')?.value) || 0;
        }

        if (recordId) {
          db.ref('transactions/' + recordId).update(recordData, () => {
            resetMainForm();
            alert("✅ Saqlandi!");
          });
        } else {
          db.ref('transactions').push(recordData, () => {
            resetMainForm();
          });
        }
      });
    }

    function editRecord(id) {
      const item = historyData[id];
      if (!item) return;

      document.getElementById('recordId').value = id;
      const fTitle = document.getElementById('formTitle');
      if(fTitle) fTitle.innerText = "✏️ Tahrirlash";
      const sBtn = document.getElementById('saveBtn');
      if(sBtn) sBtn.innerText = "Yangilash";
      document.getElementById('cancelBtn')?.classList.remove('hidden');

      const sCont = document.getElementById('selectedContactId');
      if(sCont) sCont.value = item.contactId || "";
      setOpType(item.opType);

      if (item.opType === 'purchase') {
        document.getElementById('rollSize').value = item.rollSize || '';
        document.getElementById('weightKg').value = item.weightKg || '';
        document.getElementById('pricePerKg').value = item.pricePerKg || '';
        document.getElementById('totalCalculatedPrice').value = item.totalAmount || 0;
        document.getElementById('paymentStatus').value = item.paymentStatus || 'credit';
      } else {
        document.getElementById('paidCashAmount').value = item.totalAmount || '';
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetMainForm() {
      document.getElementById('mainForm')?.reset();
      const rId = document.getElementById('recordId');
      if(rId) rId.value = '';
      const fTitle = document.getElementById('formTitle');
      if(fTitle) fTitle.innerText = "📦 Yangi Operatsiya Kiritish";
      const sBtn = document.getElementById('saveBtn');
      if(sBtn) sBtn.innerText = "Saqlash";
      document.getElementById('cancelBtn')?.classList.add('hidden');
      setOpType('purchase');
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      if (!tbody) return;
      tbody.innerHTML = '';
      const keys = Object.keys(historyData).reverse();

      keys.forEach(id => {
        const item = historyData[id];
        if(!item) return;
        const contactName = (item.contactId && contactsData[item.contactId]) ? contactsData[item.contactId].name : 'Umumiy';
        const isPurchase = item.opType === 'purchase';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="py-2 text-slate-400">${item.date ? item.date.split(',')[0] : ''}</td>
          <td class="py-2 font-bold text-slate-200">${contactName}</td>
          <td class="py-2">${isPurchase ? `<span class="text-blue-400">${item.rollSize \vert{}\vert{} '-'} (${item.weightKg || 0}kg)</span>` : '<span class="text-emerald-400">💸 Naqd</span>'}</td>
          <td class="py-2 font-bold ${isPurchase ? 'text-red-400' : 'text-emerald-400'}">${(item.totalAmount || 0).toLocaleString()}</td>
          ${isAdmin ? `
            <td class="py-2 text-right">
              <button onclick="editRecord('${id}')" class="text-blue-400 mr-1.5">✏️</button>
              <button onclick="deleteRecord('${id}')" class="text-red-500">🗑</button>
            </td>
          ` : ''}
        `;
        tbody.appendChild(tr);
      });
    }

    function deleteRecord(id) {
      if (isAdmin && confirm("O'chirmoqchimisiz?")) db.ref('transactions/' + id).remove();
    }

    function deleteContact(id) {
      if (isAdmin && confirm("Hamkorni o'chirmoqchimisiz?")) db.ref('contacts/' + id).remove();
    }

    function toggleContactForm() {
      document.getElementById('contactFormBox')?.classList.toggle('hidden');
    }

    function editContact(id) {
      const c = contactsData[id];
      if (!c) return;
      document.getElementById('editingContactId').value = id;
      document.getElementById('contactName').value = c.name || '';
      document.getElementById('contactType').value = c.type || 'supplier';
      document.getElementById('initialDebt').value = c.initialDebt || '';
      const cSave = document.getElementById('contactSaveBtn');
      if(cSave) cSave.innerText = "Yangilash";
      document.getElementById('contactCancelBtn')?.classList.remove('hidden');
      document.getElementById('contactFormBox')?.classList.remove('hidden');
    }

    function cancelContactEdit() {
      document.getElementById('editingContactId').value = '';
      document.getElementById('contactName').value = '';
      document.getElementById('initialDebt').value = '';
      const cSave = document.getElementById('contactSaveBtn');
      if(cSave) cSave.innerText = "Saqlash";
      document.getElementById('contactCancelBtn')?.classList.add('hidden');
      toggleContactForm();
    }

    function saveContact() {
      const id = document.getElementById('editingContactId')?.value;
      const name = document.getElementById('contactName')?.value.trim() || "Nomsiz";
      const type = document.getElementById('contactType')?.value || "supplier";
      const initialDebt = parseFloat(document.getElementById('initialDebt')?.value) || 0;

      const contactData = { name, type, initialDebt };

      if (id) {
        db.ref('contacts/' + id).update(contactData, () => cancelContactEdit());
      } else {
        db.ref('contacts').push(contactData, () => {
          if(document.getElementById('contactName')) document.getElementById('contactName').value = '';
          if(document.getElementById('initialDebt')) document.getElementById('initialDebt').value = '';
          toggleContactForm();
        });
      }
    }

    function copyForExcel() {
      let text = "Sana\tHamkor\tOperatsiya\tO'lcham/Kg\tSumma\n";
      for (let id in historyData) {
        const item = historyData[id];
        if(!item) continue;
        const name = (item.contactId && contactsData[item.contactId]) ? contactsData[item.contactId].name : '-';
        text += `${item.date}\t${name}\t${item.opType}\t${item.rollSize || '-'}\t${item.totalAmount}\n`;
      }
      navigator.clipboard.writeText(text).then(() => alert("✅ Nusxalandi!"));
    }

    initInterface();
  </script>
</body>
</html>
