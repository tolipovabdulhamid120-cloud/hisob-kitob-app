<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salafan Sex - Hisob-Kitob Daftari</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Firebase v8 SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-input {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    .glass-input:focus {
      border-color: #3b82f6;
      outline: none;
    }
  </style>
</head>
<body class="p-3 pb-20">

  <!-- ROL INDIKATORI VA YUQORI KARTALAR -->
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-base font-bold text-slate-100">💎 Salafan Nazorati</h1>
    <span id="roleBadge" class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-blue-500/20 text-blue-400 border border-blue-500/30">
      Aniqlanmoqda...
    </span>
  </div>

  <div class="grid grid-cols-2 gap-3 mb-4">
    <div class="glass-card p-4 rounded-2xl">
      <p class="text-xs text-slate-400 font-medium">Umumiy Qarzim</p>
      <h2 id="totalDebtSum" class="text-lg font-bold text-red-500 mt-1">0 UZS</h2>
    </div>
    <div class="glass-card p-4 rounded-2xl">
      <p class="text-xs text-slate-400 font-medium">Yuk Beruvchilar</p>
      <h2 id="suppliersCount" class="text-lg font-bold text-emerald-400 mt-1">0 ta</h2>
    </div>
  </div>

  <!-- YUK BERUVCHILAR BO'LIMI -->
  <div class="glass-card p-4 rounded-2xl mb-4">
    <div class="flex justify-between items-center mb-3">
      <h3 class="text-xs font-bold text-blue-400 uppercase tracking-wider">👥 Hamkorlar Balansi</h3>
      <button id="addContactBtn" onclick="toggleContactForm()" class="hidden px-3 py-1 bg-blue-600 hover:bg-blue-500 text-xs font-bold rounded-lg transition">
        + Yangi Sex
      </button>
    </div>

    <!-- Sex qo'shish formasi -->
    <div id="contactFormBox" class="hidden mb-4 p-3 bg-slate-900/80 rounded-xl border border-slate-800">
      <input type="text" id="contactName" placeholder="Ism yoki Sex nomi..." class="glass-input w-full p-2 text-xs rounded-lg mb-2">
      <select id="contactType" class="glass-input w-full p-2 text-xs rounded-lg mb-2">
        <option value="supplier">Yuk Beruvchi (Sex)</option>
        <option value="buyer">Yuk Oluvchi (Xaridor)</option>
      </select>
      <button onclick="saveContact()" class="w-full py-2 bg-emerald-600 text-xs font-bold rounded-lg">Saqlash</button>
    </div>

    <!-- Odamlar ro'yxati -->
    <div id="contactsList" class="space-y-2"></div>
  </div>

  <!-- OPERATSIYA KIRITISH FORMASI (Admin uchun) -->
  <div id="adminFormCard" class="hidden glass-card p-4 rounded-2xl mb-4">
    <h2 id="formTitle" class="text-sm font-bold text-blue-400 mb-3">📦 Yangi Operatsiya Kiritish</h2>
    
    <form id="mainForm">
      <input type="hidden" id="recordId">

      <div class="grid grid-cols-2 gap-2 mb-3">
        <button type="button" id="btnTypePurchase" onclick="setOpType('purchase')" class="py-2 text-xs font-bold rounded-xl bg-blue-600 text-white">
          📦 Yuk Olish
        </button>
        <button type="button" id="btnTypePayment" onclick="setOpType('payment')" class="py-2 text-xs font-bold rounded-xl bg-slate-800 text-slate-400">
          💸 Naqd Pul Berish
        </button>
      </div>

      <div class="mb-3">
        <label class="text-xs text-slate-400 mb-1 block">Hamkorni tanlang:</label>
        <select id="selectedContactId" required class="glass-input w-full p-2.5 text-xs rounded-xl">
        </select>
      </div>

      <!-- Yuk Olish -->
      <div id="purchaseFields" class="space-y-3">
        <div>
          <label class="text-xs text-slate-400 mb-1 block">Rulon o'lchami:</label>
          <input type="text" id="rollSize" placeholder="Masalan: 40x60" class="glass-input w-full p-2.5 text-xs rounded-xl">
        </div>
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-slate-400 mb-1 block">Kilogramm (kg):</label>
            <input type="number" step="0.1" id="weightKg" oninput="calculateTotal()" placeholder="0.0" class="glass-input w-full p-2.5 text-xs rounded-xl">
          </div>
          <div>
            <label class="text-xs text-slate-400 mb-1 block">1 kg Narxi (UZS):</label>
            <input type="number" id="pricePerKg" oninput="calculateTotal()" placeholder="0" class="glass-input w-full p-2.5 text-xs rounded-xl">
          </div>
        </div>

        <div>
          <label class="text-xs text-slate-400 mb-1 block">Jami Yuk Summasi (Avto):</label>
          <input type="number" id="totalCalculatedPrice" placeholder="0" readonly class="glass-input w-full p-2.5 text-xs rounded-xl font-bold text-amber-400 bg-slate-900/50">
        </div>

        <div>
          <label class="text-xs text-slate-400 mb-1 block">To'lov shakli:</label>
          <select id="paymentStatus" class="glass-input w-full p-2.5 text-xs rounded-xl">
            <option value="credit">Qarzga olindi</option>
            <option value="cash">Naqd berildi</option>
          </select>
        </div>
      </div>

      <!-- Naqd Pul Berish -->
      <div id="paymentFields" class="hidden space-y-3">
        <div>
          <label class="text-xs text-slate-400 mb-1 block">Berilgan Naqd Pul Summasi (UZS):</label>
          <input type="number" id="paidCashAmount" placeholder="0" class="glass-input w-full p-2.5 text-xs rounded-xl font-bold text-emerald-400">
        </div>
      </div>

      <button type="submit" id="saveBtn" class="w-full mt-4 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-xs rounded-xl shadow-lg">
        Saqlash (Sana Avto Yoziladi)
      </button>
    </form>
  </div>

  <!-- JADVAL: BARCHA AMALIYOTLAR TARIXI -->
  <div class="glass-card p-4 rounded-2xl">
    <div class="flex justify-between items-center mb-3">
      <h3 class="text-xs font-bold text-slate-200 uppercase">📋 Amaliyotlar Tarixi</h3>
      <button onclick="copyForExcel()" class="px-2.5 py-1 bg-emerald-600 text-[10px] font-bold rounded-lg">
        📋 Excel
      </button>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-left text-[11px]">
        <thead>
          <tr class="border-b border-slate-800 text-slate-400">
            <th class="py-2">Sana</th>
            <th class="py-2">Odam</th>
            <th class="py-2">O'lcham / Kg</th>
            <th class="py-2">Summa</th>
            <th id="thActions" class="py-2 text-right hidden">Amal</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="divide-y divide-slate-800/50">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    // SIZNING TELEGRAM ID'INGIZ BIRIKTIRILDI ✅
    const ADMIN_TELEGRAM_ID = "8081723573"; 
    
    const currentUserId = String(tg?.initDataUnsafe?.user?.id || "");
    const isAdmin = (currentUserId === ADMIN_TELEGRAM_ID || currentUserId === "");

    // Firebase Ma'lumotlar Bazasi
    firebase.initializeApp({
      databaseURL: "https://hisob-kitob-daftar-default-rtdb.firebaseio.com/"
    });
    const db = firebase.database();

    let currentOpType = 'purchase';
    let contactsData = {};
    let historyData = {};

    function initInterface() {
      const badge = document.getElementById('roleBadge');
      if (isAdmin) {
        badge.innerText = "👑 Admin Rejimi";
        badge.className = "px-2.5 py-1 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30";
        document.getElementById('adminFormCard').classList.remove('hidden');
        document.getElementById('addContactBtn').classList.remove('hidden');
        document.getElementById('thActions').classList.remove('hidden');
      } else {
        badge.innerText = "👤 Yuk Beruvchi Paneli";
      }

      db.ref('contacts').on('value', (snapshot) => {
        contactsData = snapshot.val() || {};
        renderContacts();
        renderSelectOptions();
        calculateAllBalances();
      });

      db.ref('transactions').on('value', (snapshot) => {
        historyData = snapshot.val() || {};
        renderTable();
        calculateAllBalances();
      });
    }

    function setOpType(type) {
      currentOpType = type;
      if (type === 'purchase') {
        document.getElementById('purchaseFields').classList.remove('hidden');
        document.getElementById('paymentFields').classList.add('hidden');
        document.getElementById('btnTypePurchase').className = "py-2 text-xs font-bold rounded-xl bg-blue-600 text-white";
        document.getElementById('btnTypePayment').className = "py-2 text-xs font-bold rounded-xl bg-slate-800 text-slate-400";
      } else {
        document.getElementById('purchaseFields').classList.add('hidden');
        document.getElementById('paymentFields').classList.remove('hidden');
        document.getElementById('btnTypePurchase').className = "py-2 text-xs font-bold rounded-xl bg-slate-800 text-slate-400";
        document.getElementById('btnTypePayment').className = "py-2 text-xs font-bold rounded-xl bg-emerald-600 text-white";
      }
    }

    function calculateTotal() {
      const kg = parseFloat(document.getElementById('weightKg').value) || 0;
      const price = parseFloat(document.getElementById('pricePerKg').value) || 0;
      document.getElementById('totalCalculatedPrice').value = Math.round(kg * price);
    }

    function calculateAllBalances() {
      let grandTotalDebt = 0;
      for (let cId in contactsData) { contactsData[cId].balance = 0; }

      for (let tId in historyData) {
        const item = historyData[tId];
        if (contactsData[item.contactId]) {
          if (item.opType === 'purchase' && item.paymentStatus === 'credit') {
            contactsData[item.contactId].balance += (item.totalAmount || 0);
          } else if (item.opType === 'payment') {
            contactsData[item.contactId].balance -= (item.totalAmount || 0);
          }
        }
      }

      for (let cId in contactsData) {
        grandTotalDebt += contactsData[cId].balance || 0;
      }
      document.getElementById('totalDebtSum').innerText = grandTotalDebt.toLocaleString() + " UZS";
      renderContacts();
    }

    function renderContacts() {
      const list = document.getElementById('contactsList');
      list.innerHTML = '';
      let count = 0;

      for (let id in contactsData) {
        count++;
        const c = contactsData[id];
        const balance = c.balance || 0;
        
        const div = document.createElement('div');
        div.className = "flex justify-between items-center p-2.5 bg-slate-900/60 rounded-xl border border-slate-800/80";
        div.innerHTML = `
          <div>
            <p class="font-bold text-xs text-slate-200">${c.name}</p>
            <p class="text-[10px] text-slate-400">${c.type === 'supplier' ? 'Sex (Yuk Beruvchi)' : 'Xaridor'}</p>
          </div>
          <div class="text-right">
            <p class="text-xs font-bold ${balance > 0 ? 'text-red-400' : 'text-emerald-400'}">${balance.toLocaleString()} UZS</p>
            ${isAdmin ? `<button onclick="deleteContact('${id}')" class="text-[10px] text-red-500 underline ml-2">o'chirish</button>` : ''}
          </div>
        `;
        list.appendChild(div);
      }
      document.getElementById('suppliersCount').innerText = count + " ta";
    }

    function renderSelectOptions() {
      const select = document.getElementById('selectedContactId');
      select.innerHTML = '';
      for (let id in contactsData) {
        select.innerHTML += `<option value="${id}">${contactsData[id].name}</option>`;
      }
    }

    document.getElementById('mainForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!isAdmin) return alert("Sizda ruxsat yo'q!");

      const contactId = document.getElementById('selectedContactId').value;
      if(!contactId) return alert("Iltimos, avval sex (hamkor) qo'shing!");

      const now = new Date();
      let recordData = {
        contactId: contactId,
        opType: currentOpType,
        date: now.toLocaleString('uz-UZ'),
        timestamp: now.getTime()
      };

      if (currentOpType === 'purchase') {
        const kg = parseFloat(document.getElementById('weightKg').value) || 0;
        const price = parseFloat(document.getElementById('pricePerKg').value) || 0;
        recordData.rollSize = document.getElementById('rollSize').value || '-';
        recordData.weightKg = kg;
        recordData.pricePerKg = price;
        recordData.totalAmount = kg * price;
        recordData.paymentStatus = document.getElementById('paymentStatus').value;
      } else {
        recordData.totalAmount = parseFloat(document.getElementById('paidCashAmount').value) || 0;
      }

      db.ref('transactions').push(recordData, () => {
        document.getElementById('mainForm').reset();
        setOpType('purchase');
      });
    });

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      const keys = Object.keys(historyData).reverse();

      keys.forEach(id => {
        const item = historyData[id];
        const contactName = contactsData[item.contactId] ? contactsData[item.contactId].name : 'O\'chirilgan';
        const isPurchase = item.opType === 'purchase';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="py-2 text-slate-400">${item.date ? item.date.split(',')[0] : ''}</td>
          <td class="py-2 font-bold text-slate-200">${contactName}</td>
          <td class="py-2">${isPurchase ? `<span class="text-blue-400">${item.rollSize} (${item.weightKg}kg)</span>` : '<span class="text-emerald-400">💸 Naqd Pul</span>'}</td>
          <td class="py-2 font-bold ${isPurchase ? 'text-red-400' : 'text-emerald-400'}">${(item.totalAmount || 0).toLocaleString()}</td>
          ${isAdmin ? `<td class="py-2 text-right"><button onclick="deleteRecord('${id}')" class="text-red-500">🗑</button></td>` : ''}
        `;
        tbody.appendChild(tr);
      });
    }

    function deleteRecord(id) {
      if (isAdmin && confirm("O'chirmoqchisiz?")) db.ref('transactions/' + id).remove();
    }

    function deleteContact(id) {
      if (isAdmin && confirm("Hamkorni o'chirmoqchisiz?")) db.ref('contacts/' + id).remove();
    }

    function toggleContactForm() {
      document.getElementById('contactFormBox').classList.toggle('hidden');
    }

    function saveContact() {
      const name = document.getElementById('contactName').value.trim();
      const type = document.getElementById('contactType').value;
      if (name) {
        db.ref('contacts').push({ name, type }, () => {
          document.getElementById('contactName').value = '';
          toggleContactForm();
        });
      }
    }

    function copyForExcel() {
      let text = "Sana\tHamkor\tOperatsiya\tO'lcham/Kg\tSumma\n";
      for (let id in historyData) {
        const item = historyData[id];
        const name = contactsData[item.contactId] ? contactsData[item.contactId].name : '-';
        text += `${item.date}\t${name}\t${item.opType}\t${item.rollSize || '-'}\t${item.totalAmount}\n`;
      }
      navigator.clipboard.writeText(text).then(() => alert("✅ Excel uchun nusxalandi!"));
    }

    initInterface();
  </script>
</body>
</html>
